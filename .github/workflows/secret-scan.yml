name: Secret Leak Check

on:
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secrets in diff
        run: |
          echo "🔍 Scanning PR diff for potential secrets..."

          PATTERNS=(
            'SUPABASE_SERVICE_ROLE_KEY\s*='
            'NEXT_PUBLIC_SUPABASE_ANON_KEY\s*=\s*["\x27]?eyJ'
            'sk-[a-zA-Z0-9]{20,}'
            'sb_[a-zA-Z0-9_-]{20,}'
            'BLOGGER_REFRESH_TOKEN\s*='
            'BLOGGER_CLIENT_SECRET\s*='
            'OPENROUTER_API_KEY\s*='
            'PEXELS_API_KEY\s*='
            'TELEGRAM_BOT_TOKEN\s*='
            'password\s*=\s*["\x27][^"\x27]{8,}'
            'api[_-]?key\s*=\s*["\x27][^"\x27]{8,}'
            'secret\s*=\s*["\x27][^"\x27]{8,}'
            'token\s*=\s*["\x27][^"\x27]{8,}'
          )

          FOUND=0
          DIFF=$(git diff origin/main...HEAD -- ':!*.lock' ':!package-lock.json')

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(echo "$DIFF" | grep -inP "^\+.*${pattern}" || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ POTENTIAL SECRET FOUND: $pattern"
              echo "$MATCHES" | head -3
              echo "---"
              FOUND=1
            fi
          done

          # .env 파일이 커밋에 포함되었는지 체크
          ENV_FILES=$(git diff --name-only origin/main...HEAD | grep -E '\.env' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "❌ .env FILE DETECTED IN COMMIT:"
            echo "$ENV_FILES"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "🚨 시크릿이 감지되었습니다! PR을 머지하기 전에 제거해주세요."
            echo "💡 API 키는 코드에 직접 넣지 말고 .env.local 파일에 넣어주세요."
            exit 1
          fi

          echo "✅ No secrets detected."
