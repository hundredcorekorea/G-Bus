name: "버그 리포트"
description: "동작하지 않거나 이상한 부분을 알려주세요"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: "어떤 문제인가요?"
      description: "뭘 했더니 뭐가 안 됐는지 적어주세요"
      placeholder: "예: 역경매에서 수락 버튼을 눌렀는데 아무 반응이 없었습니다"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "재현 방법"
      description: "어떻게 하면 이 버그가 다시 나오나요?"
      placeholder: |
        1. 세션 만들기
        2. 역경매로 설정
        3. 기사가 입찰
        4. 수락 버튼 클릭
        5. → 아무 반응 없음
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: "스크린샷"
      description: "가능하면 스크린샷을 붙여주세요 (드래그 앤 드롭)"
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: "기기"
      options:
        - PC (크롬)
        - PC (기타)
        - 모바일 (아이폰)
        - 모바일 (안드로이드)
    validations:
      required: true
